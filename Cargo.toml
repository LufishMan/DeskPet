[workspace]
resolver = "3"
members = ["crates/core", "crates/sys", "crates/store", "crates/runtime", "crates/sim", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
deskpet-core = { path = "crates/core" }
deskpet-runtime = { path = "crates/runtime" }
deskpet-store = { path = "crates/store" }
deskpet-sys = { path = "crates/sys" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
windows-sys = "0.59"
